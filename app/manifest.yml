# Relay — commitment operations for Jira Service Management.
#
# The enforcement design is the conclusion of the customer-transition
# investigation (phase0/CUSTOMER-TRANSITION-VALIDATION-REPORT.md, decision B):
#   * a workflow VALIDATOR guards agent and REST closure, and can explain itself;
#   * a workflow CONDITION guards the CUSTOMER PORTAL, because the portal skips
#     validators — proven live: the same transition refused an agent and admitted
#     a customer (c3-3 vs c3-7), and a condition then closed that path (c3-11).
#   * the condition is expression-only, so it reads fields Relay writes onto the
#     issue. It cannot call Relay, and it cannot say why.
#
# P2.2 adds the second half of the condition: the management state. A single
# number cannot say "Relay does not manage this issue", and saying zero would
# permit a case Relay has never recorded.

app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x

  # The authoritative issue record: management state + commitments, versioned.
  #
  # It lives in the Custom Entity Store rather than in key/value storage
  # because only the entity store offers a conditional write. `store.js`
  # commits with
  #   kvs.transact().set(key, next, { entityName: relay-ledger,
  #     conditions: new Filter().and('rev', FilterConditions.equalTo(expectedRev)) })
  # so a mutation can only land on the revision it was derived from, and creates
  # use `keyPolicy: FAIL_IF_EXISTS` so the trigger and the backfill cannot
  # produce two records for one issue.
  #
  # The attribute list is exhaustive: the entity store enforces types, rejects
  # any attribute that is not declared here, and has no null value of any type.
  # `src/record-codec.js` is the mirror of this block — it holds the same list,
  # strips every null before a write, and restores them on a read; the offline
  # manifest check fails if the two lists disagree.
  #
  # Attributes can be added to a deployed entity but never removed, so this list
  # only grows.
  #
  # `source`, `trackedBy`, `managedAt`, `untrackedAt`, `untrackedBy` and
  # `backfilledAt` are the lifecycle metadata. They are written only when they
  # mean something: a trigger-created record has no actor, so `trackedBy` is
  # absent rather than null (the store has no null to put there).
  storage:
    entities:
      - name: relay-ledger
        attributes:
          issueKey:
            type: string
          rev:
            type: integer
          version:
            type: integer
          state:
            type: string
          digest:
            type: string
          updatedAt:
            type: string
          commitments:
            type: any
          # 'track' | 'console' | 'trigger' | 'backfill'
          source:
            type: string
          # Account id of whoever tracked it, when there was a person.
          trackedBy:
            type: string
          # When the record reached `managed`.
          managedAt:
            type: string
          # When it was offboarded, and by whom.
          untrackedAt:
            type: string
          untrackedBy:
            type: string
          # When the trigger or a backfill page created it.
          backfilledAt:
            type: string

modules:
  # The two fields the workflow condition reads. Declared here so the app owns
  # them: Forge creates one locked field instance per module at deploy time,
  # read-only for users and for the Edit Issue API. The app writes them through
  # PUT /rest/api/3/app/field/{fieldIdOrKey}/value, which only the owning app can
  # call.
  #
  # Their type ids are
  #   ari:cloud:ecosystem::extension/{appId}/{environmentId}/static/{moduleKey}
  # and Relay derives each from the invocation context rather than being told.
  jira:customField:
    - key: relay-closure-count
      name: Relay open commitments
      description: "Relay's internal closure projection: the number of unresolved commitments on this issue. Read-only, written only by Relay. A workflow condition reads it to withhold closure."
      type: number
      readOnly: true
      resolver:
        function: relay-resolver
    - key: relay-management-state
      name: Relay management state
      description: "Whether Relay manages this issue — managed, initializing or unmanaged. Read-only, written only by Relay. A workflow condition reads it so an issue Relay does not manage is never blocked, and an issue it is still initialising is never opened."
      type: string
      readOnly: true
      resolver:
        function: relay-resolver

  jira:globalPage:
    - key: relay-workspace
      title: Relay
      resource: relay-ui
      resolver:
        function: relay-resolver

  jira:issuePanel:
    - key: relay-case-panel
      title: Commitments
      icon: icon.svg
      resource: relay-ui
      resolver:
        function: relay-resolver

  jira:workflowValidator:
    - key: relay-closure-validator
      name: Relay closure gate
      description: Blocks closure unless Relay does not manage the issue, or manages it and holds no unresolved commitments.
      function: relay-validator
      projectTypes:
        - company-managed

  # Customer portal coverage.
  #
  # The condition reads the app's two read-only fields (jira:customField above).
  # The field ids Jira assigns are generated per app and environment, so the
  # expression cannot be written at build time. Relay resolves the ids at
  # runtime (relay.field.resolve), and the console prints the exact line to put
  # here. Until it is replaced, the expression names fields that do not exist:
  # Jira treats an expression error as false, so every issue is refused — the
  # safe direction, and the reason the backfill must run before the condition is
  # attached in anger.
  #
  #   (state == "unmanaged") || (state == "managed" && count == 0)
  #
  # true  only when the state is exactly "unmanaged", or exactly "managed" and
  #       the count is exactly the number 0;
  # false for "initializing", for null, for any other string, and for any count
  #       that is not zero — including null, which is never coerced to 0;
  # false on an expression error, which is what a missing field raises.
  jira:workflowCondition:
    - key: relay-closure-condition
      name: Relay closure readiness
      description: Offers the closure transition only when Relay does not manage the issue, or manages it and holds no unresolved commitments.
      expression: '(issue.customfield_relay_management_state == "unmanaged") || (issue.customfield_relay_management_state == "managed" && issue.customfield_relay_closure_count == 0)'
      projectTypes:
        - company-managed

  # Every issue created after install is recorded as `unmanaged` immediately, so
  # it is not withheld for the wrong reason and never sits in the "no record"
  # state that both enforcement paths refuse. The backfill covers issues that
  # already existed.
  trigger:
    - key: relay-issue-created
      function: relay-trigger
      events:
        - avi:jira:created:issue

  function:
    - key: relay-resolver
      handler: index.handler
    - key: relay-validator
      handler: index.closureValidator
    - key: relay-trigger
      handler: index.onIssueCreated

resources:
  - key: relay-ui
    path: static/relay

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    # The person picker and assignable-user search are read:jira-user.
    - read:jira-user
    # Writing the app's own read-only fields. Documented as optional today and
    # planned to become required for the private app-field API.
    - write:app-data:jira
